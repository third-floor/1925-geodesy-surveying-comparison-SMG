<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Object Record Comparator</title>

  <!-- Bootstrap + DataTables -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      margin: 1.5rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .dual-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .panel {
      flex: 1 1 45%;
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      min-width: 280px;
    }
    .panel h5, .panel h6 {
      border-bottom: 2px solid #007bff33;
      padding-bottom: .5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .field-row {
      border-bottom: 1px dashed #eee;
      padding: .25rem 0;
      font-size: .95rem;
      display: flex;
      justify-content: space-between;
    }
    .field-row strong {
      color: #333;
      width: 40%;
      word-break: break-word;
    }
    .schema-field-row {
      border-bottom: 1px dashed #ddd;
      padding: 0.35rem 0;
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
    }
    .schema-field-row strong {
      width: 35%;
      color: #222;
    }
    #spiderChartContainer,
    #schemaSpiderPresenceContainer,
    #schemaSpiderQuantityContainer {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin: 1rem auto;
      text-align: center;
      position: relative;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    footer {
      text-align: center;
      font-size: .9rem;
      margin-top: 2rem;
      color: #777;
    }
    @media (max-width: 768px) {
      .dual-panel {
        flex-direction: column;
      }
      .panel {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🧭 Museum Object Record Comparator</h1>
    <p class="text-center text-muted mb-3">
      Compare entries between your <b>Geodesy and Surveying catalogue 1925</b> and the <b>Science Museum Group Collections Online</b>.
    </p>

    <div class="mb-3 d-flex justify-content-center">
      <input type="text" id="globalSearch" class="form-control w-50" placeholder="🔍 Search all records...">
    </div>

    <div class="table-responsive">
      <table id="recordsTable" class="table table-striped table-hover" style="width:100%">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>Built on the third-floor.</footer>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', async function() {
      console.log("📂 Loading datasets...");

      let [recordsData, comparisonData, schemaData] = await Promise.all([
        new Promise(res => Papa.parse('matched_records.csv', {
            download: true, header: true,
            complete: r => res(r.data)
        })),
        new Promise(res => Papa.parse('entity_comparison_results.csv', {
            download: true, header: true,
            complete: r => res(r.data)
        })),
        new Promise(res => Papa.parse('1925_geodesy_schema_extraction.csv', {
            download: true, header: true,
            complete: r => res(r.data)
        }))
      ]);

      recordsData = recordsData.filter(d => Object.keys(d).length > 1);
      comparisonData = comparisonData.filter(d => Object.keys(d).length > 1);
      schemaData = schemaData.filter(d => Object.keys(d).length > 1);


      // Custom sorting
      jQuery.extend(jQuery.fn.dataTable.ext.type.order, {
        "catalogue-pre": function (data) {
          const num = parseFloat(String(data).replace(/[^\d.]/g, ''));
          return isNaN(num) ? 0 : num;
        }
      });

      const visibleColumns = [
        "Catalogue number", "Object name", "Object/Inventory number",
        "uid", "identifier", "title"
      ];
      const columns = Object.keys(recordsData[0])
        .filter(k => visibleColumns.includes(k))
        .map(k => ({
          title: k,
          data: k,
          type: k === "Catalogue number" ? "catalogue" : "string"
        }));

      const table = $('#recordsTable').DataTable({
        data: recordsData,
        columns: columns,
        pageLength: 25,
        responsive: true,
        order: [[0, 'asc']]
      });

      $('#globalSearch').on('keyup', function() {
        table.search(this.value).draw();
      });

      const aeronauticsFields = [
        "Filename", "Catalogue number", "Object name", "Maker/Donor",
        "Date of creation", "Object entry information", "Object/Inventory number"
      ];
      const smgFields = [
        "uid", "identifier", "title", "description", "category",
        "material", "object_name", "date", "place", "maker", "image"
      ];

      const entityMetrics = [
        "ObjectNames", "Makers", "Organisations/institutions", "Dates",
        "Places", "Descriptions", "Other"
      ];

      const schemaFields = [
        "object_number","secondary_identifier","whole_or_part","item_count","collection","legal_status",
        "object_name","description","location",
        "hazards","makers_and_associated_people","place_made","date_made",
        "materials","measurements","interpretation","interpretation_source","interpretation_date"
      ];

      let activeChart = null;
      let activeSchemaPresenceChart = null;
      let activeSchemaQuantityChart = null;

      /* ---------------------- Row click behaviour ---------------------- */
      $('#recordsTable tbody').on('click', 'tr', function() {
        const rowData = table.row(this).data();
        const idx = table.row(this).index();

        const comp = comparisonData.find(r => Number(r.RowIndex) === idx);
        const schema = schemaData.find(r => Number(r.RowIndex) === idx);

        /* ---------------------- Build Standard Panels ---------------------- */
        const chartHTML = `
          <div id="spiderChartContainer">
            <canvas id="spiderChart"></canvas>
            <button id="downloadChart" class="btn btn-outline-secondary btn-sm mt-2">⬇️ Download Comparison Chart</button>
          </div>
        `;

        let leftHTML = `<div class="panel"><h5>📘 Geodesy and Surveying Catalogue 1925</h5>`;
        aeronauticsFields.forEach(k => {
          if (k in rowData)
            leftHTML += `<div class="field-row"><strong>${k}</strong><span>${rowData[k] || ''}</span></div>`;
        });

        // Unique fields
        if (comp?.Unique_to_Meteorology) {
          try {
            const unique = JSON.parse(comp.Unique_to_Meteorology);
            leftHTML += `<div class="mt-3"><h6>🌿 Unique to G&S Catalogue</h6>`;
            for (const [cat, list] of Object.entries(unique))
              if (list?.length)
                leftHTML += `<div><strong>${cat}:</strong> ${list.join(', ')}</div>`;
            leftHTML += `</div>`;
          } catch {}
        }
        leftHTML += `</div>`;

        let rightHTML = `<div class="panel"><h5>🏛️ Science Museum Group Collections Online</h5>`;
        smgFields.forEach(k => {
          if (k in rowData) {
            let val = rowData[k] || '';
            if (k === 'image' && val)
              val = `<a href="${val}" target="_blank">View image 🔗</a>`;
            if (k === 'uid' && val)
              val = `<a href="https://collection.sciencemuseumgroup.org.uk/objects/${val}" target="_blank">${val}</a>`;
            rightHTML += `<div class="field-row"><strong>${k}</strong><span>${val}</span></div>`;
          }
        });

        if (comp?.Unique_to_SMG) {
          try {
            const unique = JSON.parse(comp.Unique_to_SMG);
            rightHTML += `<div class="mt-3"><h6>🏺 Unique to SMG</h6>`;
            for (const [cat, list] of Object.entries(unique))
              if (list?.length)
                rightHTML += `<div><strong>${cat}:</strong> ${list.join(', ')}</div>`;
            rightHTML += `</div>`;
          } catch {}
        }
        rightHTML += `</div>`;

        /* ---------------------- New Schema Panel ---------------------- */
        let schemaHTML = `
          <div class="panel mt-4">
            <h5>📑 Extracted Schema Fields (AI-Enhanced Record)</h5>
        `;

        if (!schema) {
          schemaHTML += `<p class="text-muted fst-italic">No extracted schema data for this record.</p>`;
        } else {
          schemaFields.forEach(f => {
            let val = schema[f] || null;

            // Pretty-print arrays or JSON objects
            if (typeof val === "string" && (val.startsWith("[") || val.startsWith("{"))) {
              try { val = JSON.stringify(JSON.parse(val), null, 2); }
              catch {}
            }

            schemaHTML += `
              <div class="schema-field-row">
                <strong>${f}</strong>
                <span style="white-space:pre-wrap; text-align:left;">${val || ""}</span>
              </div>
            `;
          });
        }

        schemaHTML += `</div>`;

        /* ---------------------- Schema Spider Charts (Presence + Quantities) ---------------------- */
        const schemaSpiderHTML = `
          <div class="mt-4">
            <h5 class="text-center mt-4">📊 Schema Entity Analysis</h5>

            <div id="schemaSpiderPresenceContainer">
              <canvas id="schemaSpiderPresence"></canvas>
              <button id="downloadPresenceChart" class="btn btn-outline-secondary btn-sm mt-2">⬇️ Download Presence Chart</button>
            </div>

            <div id="schemaSpiderQuantityContainer" class="mt-4">
              <canvas id="schemaSpiderQuantity"></canvas>
              <button id="downloadQuantityChart" class="btn btn-outline-secondary btn-sm mt-2">⬇️ Download Quantity Chart</button>
            </div>
          </div>
        `;

        /* ---------------------- Modal ---------------------- */
        const modalHTML = `
          <div class="modal fade" id="compareModal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">🔎 Compare Record</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">

                  ${chartHTML}

                  <div class="dual-panel">${leftHTML + rightHTML}</div>

                  ${schemaHTML}

                  ${schemaSpiderHTML}

                  <div class="mt-4">
                    <h6>🖼️ Related Image</h6>
                    <img id="recordImage" src="pages/${rowData["Filename"]}" 
                         class="img-fluid rounded shadow-sm" 
                         style="max-height:400px; cursor:pointer;">
                  </div>

                </div>
              </div>
            </div>
          </div>
        `;

        $('#compareModal').remove();
        $('body').append(modalHTML);

        const modal = new bootstrap.Modal(document.getElementById('compareModal'));
        modal.show();

        /* ---------------------- Build Main Spider Chart ---------------------- */
        if (comp) {
          const ctx = document.getElementById('spiderChart');

          const meteorologyValues = entityMetrics.map(m => Number(comp[`Meteorology_${m}`] || 0));
          const smgValues = entityMetrics.map(m => Number(comp[`SMG_${m}`] || 0));
          const entryMax = Math.max(...meteorologyValues, ...smgValues, 1);

          activeChart = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: entityMetrics,
              datasets: [
                {
                  label: "Geodesy 1925",
                  data: meteorologyValues,
                  backgroundColor: "rgba(54,162,235,0.2)",
                  borderColor: "rgba(54,162,235,1)",
                  borderWidth: 2
                },
                {
                  label: "Science Museum Group",
                  data: smgValues,
                  backgroundColor: "rgba(255,99,132,0.2)",
                  borderColor: "rgba(255,99,132,1)",
                  borderWidth: 2
                }
              ]
            },
            options: {
              scales: {
                r: { beginAtZero: true, max: entryMax + 1 }
              }
            }
          });
        }

        /* ---------------------- Schema Presence Chart ---------------------- */
        if (schema) {
          const presenceCtx = document.getElementById('schemaSpiderPresence');
          const quantityCtx = document.getElementById('schemaSpiderQuantity');

          const presenceValues = schemaFields.map(f => schema[f] ? 1 : 0);
          const quantityValues = schemaFields.map(f => {
            const v = schema[f];
            if (!v) return 0;
            if (typeof v === "string" && (v.startsWith("[") || v.startsWith("{"))) {
              try {
                const parsed = JSON.parse(v);
                if (Array.isArray(parsed)) return parsed.length;
                if (typeof parsed === "object") return Object.keys(parsed).length;
              } catch {}
            }
            return 1;
          });

          const maxQ = Math.max(...quantityValues, 1);

          activeSchemaPresenceChart = new Chart(presenceCtx, {
            type: 'radar',
            data: {
              labels: schemaFields,
              datasets: [{
                label: "Presence (1 = present)",
                data: presenceValues,
                backgroundColor: "rgba(46,204,113,0.2)",
                borderColor: "rgba(46,204,113,1)",
                borderWidth: 2
              }]
            },
            options: {
              scales: { r: { beginAtZero: true, max: 1 } }
            }
          });

          activeSchemaQuantityChart = new Chart(quantityCtx, {
            type: 'radar',
            data: {
              labels: schemaFields,
              datasets: [{
                label: "Quantity (number of values)",
                data: quantityValues,
                backgroundColor: "rgba(155,89,182,0.2)",
                borderColor: "rgba(155,89,182,1)",
                borderWidth: 2
              }]
            },
            options: {
              scales: { r: { beginAtZero: true, max: maxQ + 1 } }
            }
          });

          // downloads
          document.getElementById("downloadPresenceChart").onclick = () => {
            const link = document.createElement('a');
            link.download = "schema_presence_chart.png";
            link.href = activeSchemaPresenceChart.toBase64Image();
            link.click();
          };

          document.getElementById("downloadQuantityChart").onclick = () => {
            const link = document.createElement('a');
            link.download = "schema_quantity_chart.png";
            link.href = activeSchemaQuantityChart.toBase64Image();
            link.click();
          };
        }

      }); // end row click handler

  }); // end DOMContentLoaded
  </script>
</body>
</html>
