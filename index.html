<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Object Record Comparator</title>

  <!-- Bootstrap + DataTables -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      margin: 1.5rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .dual-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .panel {
      flex: 1 1 45%;
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      min-width: 280px;
    }
    .panel h5 {
      border-bottom: 2px solid #007bff33;
      padding-bottom: .5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .field-row {
      border-bottom: 1px dashed #eee;
      padding: .25rem 0;
      font-size: .95rem;
      display: flex;
      justify-content: space-between;
    }
    .field-row strong {
      color: #333;
      width: 45%;
      word-break: break-word;
    }
    #spiderChartContainer {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin: 1rem auto;
      text-align: center;
      position: relative;
    }
    #spiderChart {
      width: 100%;
      height: 100%;
    }
    footer {
      text-align: center;
      font-size: .9rem;
      margin-top: 2rem;
      color: #777;
    }
    @media (max-width: 768px) {
      .dual-panel {
        flex-direction: column;
      }
      .panel {
        flex: 1 1 100%;
      }
      #spiderChartContainer {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🧭 Museum Object Record Comparator</h1>
    <p class="text-center text-muted mb-3">
      Compare entries between your <b>Geodesy and Surveying catalogue 1925</b> and the <b>Science Museum Group Collections Online</b>.
    </p>

    <div class="mb-3 d-flex justify-content-center">
      <input type="text" id="globalSearch" class="form-control w-50" placeholder="🔍 Search all records...">
    </div>

    <div class="table-responsive">
      <table id="recordsTable" class="table table-striped table-hover" style="width:100%">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <footer>Built on the third-floor.</footer>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      console.log("📂 Loading datasets...");

      const [recordsData, comparisonData] = await Promise.all([
        new Promise(res => Papa.parse('matched_records.csv', {download: true, header: true, complete: r => res(r.data.filter(d => Object.keys(d).length > 1))})),
        new Promise(res => Papa.parse('entity_comparison_results.csv', {download: true, header: true, complete: r => res(r.data.filter(d => Object.keys(d).length > 1))}))
      ]);

      // ---- Custom sorting for Catalogue number ----
      jQuery.extend(jQuery.fn.dataTable.ext.type.order, {
        "catalogue-pre": function (data) {
          const num = parseFloat(String(data).replace(/[^\d.]/g, ''));
          return isNaN(num) ? 0 : num;
        }
      });

      const visibleColumns = [
        "Catalogue number", "Object name", "Object/Inventory number",
        "uid", "identifier", "title"
      ];
      const columns = Object.keys(recordsData[0])
        .filter(k => visibleColumns.includes(k))
        .map(k => ({
          title: k,
          data: k,
          type: k === "Catalogue number" ? "catalogue" : "string"
        }));

      const table = $('#recordsTable').DataTable({
        data: recordsData,
        columns: columns,
        pageLength: 25,
        responsive: true,
        order: [[0, 'asc']]
      });

      $('#globalSearch').on('keyup', function() {
        table.search(this.value).draw();
      });

      const aeronauticsFields = [
        "Filename", "Catalogue number", "Object name", "Maker/Donor",
        "Date of creation", "Object entry information", "Object/Inventory number"
      ];
      const smgFields = [
        "uid", "identifier", "title", "description", "category",
        "material", "object_name", "date", "place", "maker", "image"
      ];
      const metrics = ["ObjectNames", "Makers", "Organisations/institutions", "Dates", "Places", "Descriptions", "Other"];

      let activeChart = null;

      $('#recordsTable tbody').on('click', 'tr', function() {
        const rowData = table.row(this).data();
        if (!rowData) return;

        const idx = table.row(this).index();
        const comp = comparisonData.find(r => Number(r.RowIndex) === idx);

        const chartHTML = `
          <div id="spiderChartContainer">
            <canvas id="spiderChart"></canvas>
            <button id="downloadChart" class="btn btn-outline-secondary btn-sm mt-2">⬇️ Download Chart</button>
          </div>
        `;

        // Aeronautics panel
        let leftHTML = `<div class="panel"><h5>📘 Geodesy and Surveying catalogue 1925</h5>`;
        aeronauticsFields.forEach(k => {
          if (k in rowData)
            leftHTML += `<div class="field-row"><strong>${k}</strong><span>${rowData[k] || ''}</span></div>`;
        });

        // Unique Aeronautics
        if (comp && comp.Unique_to_Meteorology) {
          try {
            const cleaned = comp.Unique_to_Meteorology.replace(/[\r\n]+/g, ' ');
            const unique = JSON.parse(cleaned);
            leftHTML += `<div class="mt-3"><h6>🌿 Unique to Geodesy and Surveying Catalogue</h6>`;
            for (const [category, list] of Object.entries(unique)) {
              if (Array.isArray(list) && list.length > 0)
                leftHTML += `<div><strong>${category}:</strong> ${list.join(', ')}</div>`;
            }
            leftHTML += `</div>`;
          } catch (e) {
            console.warn("⚠️ Could not parse Unique_to_Meteorology:", e);
          }
        }
        leftHTML += `</div>`;

        // SMG panel
        let rightHTML = `<div class="panel"><h5>🏛️ Science Museum Group Collections Online</h5>`;
        smgFields.forEach(k => {
          if (k in rowData) {
            let val = rowData[k] || '';

            if (k === 'image' && val) {
              val = `<a href="${val}" target="_blank">View image 🔗</a>`;
            }

            if (k === 'uid' && val) {
              const baseUrl = 'https://collection.sciencemuseumgroup.org.uk/objects/';
              val = `<a href="${baseUrl}${val}" target="_blank">${val}</a>`;
            }

            rightHTML += `<div class="field-row"><strong>${k}</strong><span>${val}</span></div>`;
          }
        });

        // Unique SMG
        if (comp && comp.Unique_to_SMG) {
          try {
            const cleaned = comp.Unique_to_SMG.replace(/[\r\n]+/g, ' ');
            const unique = JSON.parse(cleaned);
            rightHTML += `<div class="mt-3"><h6>🏺 Unique to Science Museum Group</h6>`;
            for (const [category, list] of Object.entries(unique)) {
              if (Array.isArray(list) && list.length > 0)
                rightHTML += `<div><strong>${category}:</strong> ${list.join(', ')}</div>`;
            }
            rightHTML += `</div>`;
          } catch (e) {
            console.warn("⚠️ Could not parse Unique_to_SMG:", e);
          }
        }
        rightHTML += `</div>`;

        // Modal HTML
        const modalHTML = `
          <div class="modal fade" id="compareModal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">🔎 Compare Record</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                  ${chartHTML}
                  <div class="dual-panel">${leftHTML + rightHTML}</div>
                  <div class="mt-4">
                    <h6>🖼️ Related Image</h6>
                    <img id="recordImage" src="pages/${rowData["Filename"]}" 
                         alt="${rowData["Object name"] || ''}" 
                         class="img-fluid rounded shadow-sm" 
                         style="max-height:400px; cursor:pointer;">
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        $('#compareModal').remove();
        $('body').append(modalHTML);
        const modal = new bootstrap.Modal(document.getElementById('compareModal'));
        modal.show();

        // destroy chart when modal closes
        document.getElementById('compareModal').addEventListener('hidden.bs.modal', () => {
          if (activeChart) {
            activeChart.destroy();
            activeChart = null;
          }
        });

        // Radar chart
        const ctx = document.getElementById('spiderChart');
        if (comp) {
          const meteorologyValues = metrics.map(m => {
            const key = `Meteorology_${m}`.replace(/\//g, '_');
            return Number(comp[key] || 0);
          });
          const smgValues = metrics.map(m => {
            const key = `SMG_${m}`.replace(/\//g, '_');
            return Number(comp[key] || 0);
          });
          const entryMax = Math.max(...meteorologyValues, ...smgValues, 1);

          activeChart = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: metrics,
              datasets: [
                {
                  label: 'Geodesy and Surveying Catalogue',
                  data: meteorologyValues,
                  backgroundColor: 'rgba(54, 162, 235, 0.2)',
                  borderColor: 'rgba(54, 162, 235, 1)',
                  borderWidth: 2,
                  pointRadius: 3
                },
                {
                  label: 'Science Museum Group',
                  data: smgValues,
                  backgroundColor: 'rgba(255, 99, 132, 0.2)',
                  borderColor: 'rgba(255, 99, 132, 1)',
                  borderWidth: 2,
                  pointRadius: 3
                }
              ]
            },
            options: {
              responsive: false,
              maintainAspectRatio: false,
              plugins: {
                tooltip: { enabled: false },
                legend: { position: 'bottom', labels: { font: { size: 12 } } },
                title: { display: true, text: 'Information Richness Comparison', font: { size: 14 } }
              },
              scales: {
                r: {
                  beginAtZero: true,
                  max: entryMax + 1,
                  ticks: { stepSize: Math.ceil(entryMax / 4), color: '#555', backdropColor: 'transparent' },
                  grid: { color: '#ddd' },
                  angleLines: { color: '#ccc' }
                }
              },
              animation: false
            }
          });

          document.getElementById('downloadChart').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `${rowData["Object name"] || "comparison"}.png`;
            link.href = activeChart.toBase64Image();
            link.click();
          });
        } else {
          ctx.parentElement.innerHTML = "<p class='text-muted fst-italic'>⚠️ No comparison data found for this record.</p>";
        }

        // ---- Image fullscreen + navigation ----
        const allFiles = recordsData.map(r => r["Filename"]).filter(f => f);
        let currentIndex = allFiles.indexOf(rowData["Filename"]);

        $('#recordImage').on('click', function() {
          const overlay = $(`
            <div id="imgOverlay" style="
              position:fixed;top:0;left:0;width:100%;height:100%;
              background:rgba(0,0,0,0.9);z-index:9999;
              display:flex;align-items:center;justify-content:center;">
              <img id="overlayImg" src="pages/${allFiles[currentIndex]}" 
                   style="max-width:90%;max-height:90%;border-radius:10px;">
              <button id="prevImg" class="btn btn-light position-absolute top-50 start-0 translate-middle-y ms-3">⟨</button>
              <button id="nextImg" class="btn btn-light position-absolute top-50 end-0 translate-middle-y me-3">⟩</button>
            </div>
          `).appendTo('body');

          const updateImg = () => {
            $('#overlayImg').attr('src', `pages/${allFiles[currentIndex]}`);
          };

          $('#prevImg').on('click', () => {
            currentIndex = (currentIndex - 1 + allFiles.length) % allFiles.length;
            updateImg();
          });

          $('#nextImg').on('click', () => {
            currentIndex = (currentIndex + 1) % allFiles.length;
            updateImg();
          });

          $('#imgOverlay').on('click', e => {
            if (e.target.id === 'imgOverlay') $('#imgOverlay').remove();
          });

          $(document).on('keydown.overlay', e => {
            if (e.key === 'Escape') $('#imgOverlay').remove();
            if (e.key === 'ArrowLeft') $('#prevImg').click();
            if (e.key === 'ArrowRight') $('#nextImg').click();
          });
        });
      });
    });
  </script>
</body>
</html>
